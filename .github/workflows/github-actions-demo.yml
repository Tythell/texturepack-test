name: Github Actions Demo
run-name: ${{ github.actor }} is testing out Github actions
on: [push]
jobs:
  Explore-Github-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The job wa automatically triggered by a ${{github.event_name}} event"
      - run: echo "The job is running on ${{runner.os}} hosted by Github!"
      - run: echo "The name of your branch is ${{github.ref}} and your repo is ${{github.repository}}"
      - name: Check out repository code
        uses: actions/checkout@v5
      - run: echo "The ${{github.repository}} repo has been cloned to the runner."
      - run: echo "Workflow is now ready to test code on the runner."
      - name: List files in the repository
        run: |
          ls ${{github.workspace}}
        - run: echo "This job status is ${{job.status}}"
